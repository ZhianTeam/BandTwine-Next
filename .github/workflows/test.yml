name: Test Suite

on:
  push:
    branches:
      - main
      - 'dev/*'
      - 'fix/*'
  pull_request:
    branches:
      - main
      - 'dev/*'
      - 'fix/*'

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 23.x, 24.x, 25.x, 26.x]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Check test fixtures exist
        run: |
          test -d test-fixtures/minimal-story || echo "Warning: minimal-story fixture missing"
          test -d test-fixtures/invalid-kdl-syntax || echo "Warning: invalid-kdl-syntax fixture missing"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true
